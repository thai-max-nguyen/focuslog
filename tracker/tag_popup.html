<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FocusLog — Tag Session</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #131313;
    color: #e5e2e1;
    height: 100vh;
    overflow: hidden;
  }
  .header {
    background: #1a1a1a;
    border-bottom: 1px solid #252525;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .header-title { font-size: 12px; color: #888; flex: 1; }
  .close-btn {
    background: none; border: none; color: #555;
    font-size: 18px; cursor: pointer; line-height: 1;
    padding: 0 2px;
  }
  .close-btn:hover { color: #e5e2e1; }
  .body { padding: 16px; }
  .context-line { font-size: 13px; color: #aaa; margin-bottom: 4px; }
  .context-app { color: #4f86f7; font-weight: 600; }
  .context-duration { color: #e5e2e1; font-weight: 700; font-size: 15px; }
  .prompt { font-size: 12px; color: #666; margin-bottom: 12px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .suggestion-btn {
    background: #1e2a3a; color: #4f86f7;
    border: 1px solid #2a3a5a; border-radius: 20px;
    padding: 6px 13px; font-size: 12px; cursor: pointer;
    transition: background 0.1s;
  }
  .suggestion-btn:hover { background: #2a3a5a; }
  .input-row { position: relative; margin-bottom: 10px; }
  .tag-input {
    width: 100%;
    background: #0d0d0d; border: 1px solid #333; border-radius: 7px;
    padding: 8px 11px; color: #e5e2e1; font-size: 13px;
    outline: none;
  }
  .tag-input:focus { border-color: #4f86f7; }
  .footer { display: flex; justify-content: flex-end; }
  .skip-btn {
    background: none; border: none; color: #444;
    font-size: 11px; cursor: pointer; padding: 4px 0;
  }
  .skip-btn:hover { color: #888; }
  #loading { padding: 32px 16px; text-align: center; color: #555; font-size: 12px; }
  #error { padding: 16px; text-align: center; color: #ff6b6b; font-size: 12px; display: none; }
</style>
</head>
<body>

<div id="loading">Loading…</div>
<div id="error">Could not load session info. <button onclick="doSkip()" style="background:none;border:none;color:#ff6b6b;cursor:pointer;text-decoration:underline;font-size:12px;">Dismiss</button></div>

<div id="popup" style="display:none">
  <div class="header">
    <span>⏱</span>
    <span class="header-title">FocusLog</span>
    <button class="close-btn" onclick="doSkip()">×</button>
  </div>
  <div class="body">
    <div class="context-line">
      You spent <span class="context-duration" id="duration-text"></span> on
      <span class="context-app" id="app-name-text"></span>
    </div>
    <div class="prompt">What were you working on?</div>
    <div class="suggestions" id="suggestions-container"></div>
    <div class="input-row">
      <input
        class="tag-input"
        id="custom-input"
        placeholder="Or type your own…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
    </div>
    <div class="footer">
      <button class="skip-btn" onclick="doSkip()">Skip</button>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const SESSION_ID = parseInt(params.get('session_id') || '0', 10);
  const API = 'http://127.0.0.1:7331';

  // Position + resize popup to bottom-right corner
  try {
    window.resizeTo(380, 310);
    window.moveTo(screen.width - 400, screen.height - 360);
  } catch(e) {}

  async function load() {
    try {
      const res = await fetch(`${API}/api/tag-suggestions?session_id=${SESSION_ID}`);
      if (!res.ok) throw new Error('not found');
      const data = await res.json();
      document.getElementById('duration-text').textContent = data.duration_str;
      document.getElementById('app-name-text').textContent = data.app_name;

      const container = document.getElementById('suggestions-container');
      data.suggestions.forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'suggestion-btn';
        btn.textContent = label;
        btn.onclick = () => doTag(label, 'suggested');
        container.appendChild(btn);
      });

      document.getElementById('loading').style.display = 'none';
      document.getElementById('popup').style.display = 'block';
      document.getElementById('custom-input').focus();
    } catch(e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
  }

  document.addEventListener('DOMContentLoaded', load);

  document.getElementById('custom-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = e.target.value.trim();
      if (val) doTag(val, 'user');
    }
    if (e.key === 'Escape') doSkip();
  });

  async function doTag(label, source) {
    try {
      await fetch(`${API}/api/tag`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: SESSION_ID, task_label: label, source})
      });
    } catch(e) {}
    window.close();
    // Fallback for browsers that block window.close() on non-script-opened tabs
    setTimeout(() => { document.body.innerHTML = '<div style="padding:24px;color:#666;font-size:12px;text-align:center;">Session tagged. You may close this tab.</div>'; }, 200);
  }

  async function doSkip() {
    await fetch(`${API}/api/tag-skip`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: SESSION_ID})
    }).catch(() => {});
    window.close();
    // Fallback for browsers that block window.close() on non-script-opened tabs
    setTimeout(() => { document.body.innerHTML = '<div style="padding:24px;color:#666;font-size:12px;text-align:center;">Session skipped. You may close this tab.</div>'; }, 200);
  }
</script>
</body>
</html>
